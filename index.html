addEventListener('appinstalled',()=>{window.__dip=null;const b=document.getElementById('bInst');if(b)b.hidden=true});

<style>
:root{--br:#f26a1b;--brd:#d95a10;--ink:#1b1f27;--mu:#6b7280;--ln:#e6e8ec;--bg:#f4f5f7;--cd:#fff;--ok:#12805c;--bad:#c0392b;--r:14px;color-scheme:light}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;padding-bottom:calc(76px + env(safe-area-inset-bottom))}
button,input{font:inherit;color:inherit}button{cursor:pointer}
.top{position:sticky;top:0;z-index:20;background:var(--br);color:#fff;padding:calc(10px + env(safe-area-inset-top)) 16px 10px;display:flex;justify-content:space-between;align-items:center}
.top b{font-size:19px;letter-spacing:.3px;display:block}.top small{opacity:.9;font-size:12px;text-transform:capitalize}
.top button{background:rgba(255,255,255,.2);border:0;color:#fff;border-radius:10px;padding:8px 12px;font-size:14px;font-weight:600}
.app{max-width:720px;margin:0 auto;padding:14px}
.card{background:var(--cd);border-radius:var(--r);padding:14px;margin-bottom:12px;box-shadow:0 1px 2px rgba(16,24,40,.06)}

.btn{min-height:48px;padding:0 16px;border-radius:12px;border:1px solid var(--ln);background:#fff;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.pri{background:var(--br);border-color:var(--br);color:#fff}.btn.pri:active{background:var(--brd)}
.blk{width:100%}.lg{min-height:56px;font-size:18px}.dg{color:var(--bad);border-color:#f2c9c4}.sm{min-height:38px;padding:0 12px;font-size:14px}
.chips{display:flex;gap:8px;overflow-x:auto;padding-bottom:4px}
.chip{flex:none;min-height:38px;padding:0 14px;border-radius:99px;border:1px solid var(--ln);background:#fff;font-size:14px;font-weight:600;color:var(--mu)}
.chip.on{background:var(--ink);border-color:var(--ink);color:#fff}
.dates{display:grid;grid-template-columns:1fr 1fr;gap:8px}

.item .l{min-width:0}.item .l b{display:block;overflow:hidden;text-overflow:ellipsis}

.tag.bad{background:#fdeceb;color:var(--bad)}.tag.ok{background:#e6f5ef;color:var(--ok)}.tag.wn{background:#fff3e0;color:#b45309}

.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:#fff;border-top:1px solid var(--ln);display:flex;padding-bottom:env(safe-area-inset-bottom)}
.nav button{flex:1;border:0;background:none;padding:8px 4px 6px;color:var(--mu);font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:2px;position:relative}
.nav button.on{color:var(--br)}
.nav svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.nav .bd{position:absolute;top:4px;left:calc(50% + 8px);background:var(--bad);color:#fff;border-radius:99px;font-size:11px;padding:0 6px;min-width:18px}

.seg button{flex:1;min-height:42px;border:0;border-radius:10px;background:none;font-weight:700;color:var(--mu)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
#sheet{position:fixed;inset:0;z-index:50;background:rgba(15,20,30,.5);display:flex;align-items:flex-end;justify-content:center}
.box{background:#fff;width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:20px 20px 0 0;padding:0 16px calc(16px + env(safe-area-inset-bottom))}
@media(min-width:700px){#sheet{align-items:center}.box{border-radius:20px;max-height:88vh}}
.bh{position:sticky;top:0;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:14px 0 8px;z-index:2}
.bh b{font-size:18px}.bh button{border:0;background:#eef0f3;border-radius:99px;width:36px;height:36px;font-size:18px}
.res{max-height:190px;overflow:auto;margin-top:8px;border:1px solid var(--ln);border-radius:12px}

.ln{border-bottom:1px solid var(--ln);padding:10px 0}.ln .a{display:flex;justify-content:space-between;gap:8px;font-weight:600}
.ln .b{display:flex;align-items:center;gap:8px;margin-top:6px}.ln .b .in{width:104px;min-height:40px;padding:0 8px}
.stp{display:flex;align-items:center;gap:4px;margin-left:auto}

.tot{display:flex;justify-content:space-between;align-items:baseline;padding:12px 0}.tot b{font-size:28px}
.foot{position:sticky;bottom:0;background:#fff;padding-top:10px;display:grid;gap:8px}
.note{font-size:13px;color:var(--mu);margin:6px 0 0}
h4{margin:16px 0 6px;font-size:14px;color:var(--mu)}
.t{width:100%;border-collapse:collapse;font-size:14px}.t td,.t th{padding:6px 4px;border-bottom:1px solid var(--ln);text-align:left}.t .n{text-align:right;white-space:nowrap}
.paper{background:#fff;border:1px solid var(--ln);border-radius:6px;overflow:hidden;font-size:13px;color:#111}
.ph{background:var(--br);color:#fff;padding:12px 14px}.ph b{font-size:22px;display:block;letter-spacing:.5px}.ph span{font-size:12px}
.pb{padding:12px 14px}.pt{display:flex;justify-content:space-between;font-weight:800;font-size:15px;margin-bottom:6px}
.pm{color:#444;line-height:1.5;margin-bottom:8px}
.pts{margin:8px 0 0 auto;width:75%}.pts div{display:flex;justify-content:space-between;padding:2px 0}
.pts .g{font-weight:800;font-size:15px;border-top:1px solid #111;margin-top:4px;padding-top:4px}
.psg{display:flex;justify-content:space-between;align-items:flex-end;margin-top:14px;min-height:120px;color:#555}
.psg img{width:130px;height:130px;margin:-6px 0 -6px auto}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
#splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;padding:24px;text-align:center;color:#fff;background:linear-gradient(rgba(0,0,0,.35),rgba(0,0,0,.6)),url(fond.jpg) center/cover #f26a1b;transition:opacity .6s}
#splash.out{opacity:0;pointer-events:none}
#splash p{margin:0;font-size:17px;text-shadow:0 2px 8px rgba(0,0,0,.6)}
#splash h2{margin:0;font-size:clamp(34px,10vw,56px);letter-spacing:1px;text-shadow:0 2px 12px rgba(0,0,0,.7)}
#splash i{display:block;width:min(260px,70%);height:5px;border-radius:5px;background:rgba(255,255,255,.35);overflow:hidden}
#splash i::after{content:"";display:block;height:100%;background:#f26a1b;animation:ld 5s linear forwards}
@keyframes ld{from{width:0}to{width:100%}}
#toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);padding:10px 16px;border-radius:10px;background:var(--ink);color:#fff;display:none;max-width:90%;z-index:90;font-size:14px;text-align:center}
#toast.err{background:var(--bad)}
@media print{body{padding:0;background:#fff}.top,.nav,.app,#splash,.noprint,#toast{display:none!important}#sheet{position:static;background:none;display:block}.box{max-height:none;overflow:visible;padding:0;max-width:none}.bh{display:none}.paper{border:0}}
</style>

<body>
<div id="splash" role="status"><p>Bienvenue sur</p><h2>KYN--SHOP</h2><i></i></div>
<header class="top"><div><b id="shop">KYN--SHOP</b><small id="today"></small></div><div style="display:flex;gap:8px"><button id="bInst" data-a="inst" hidden>Installer</button><button data-a="settings">Réglages</button></div></header>

<main class="app">
 <section id="t-ventes">
  <div class="card hero" data-a="ben" style="cursor:pointer"><small>Bénéfice du jour (encaissé)</small><div class="big" id="hBen">0 F</div><div class="sub" id="hSub"></div><div class="sub" style="margin-top:4px;color:var(--br);font-weight:600">Touchez pour voir le détail ›</div></div>
  <button class="btn pri blk lg" data-a="new" style="margin-bottom:12px">+ Nouvelle vente</button>
  <div class="card">
   <div class="chips" id="chips"></div>
   <div class="dates" id="dts" style="margin-top:10px" hidden><div><label>Du</label><input class="in" type="date" id="pF"></div><div><label>Au</label><input class="in" type="date" id="pT"></div></div>
   <div class="kpis" id="kpis"></div>
   <div class="dates"><button class="btn" data-a="benper">Détail du bénéfice</button><button class="btn" data-a="releve">Relevé PDF</button></div>
  </div>

 </section>
 <section id="t-credits" hidden>
  <div class="card hero" id="crSum"></div>
  <input class="in" id="crQ" placeholder="Rechercher un client…" autocomplete="off" style="margin-bottom:12px">
  <div id="crList"></div>
 </section>
 <section id="t-stock" hidden>
  <div class="kpis" id="stK" style="margin-top:0"></div>
  <button class="btn pri blk lg" data-a="art" data-id="0" style="margin-bottom:12px">+ Ajouter un article</button>
  <div class="seg" id="stSeg" style="margin-bottom:12px"><button data-a="stv" data-v="stock">En stock</button><button data-a="stv" data-v="sorties">Sorties</button></div>
  <input class="in" id="stQ" placeholder="Rechercher un article…" autocomplete="off" style="margin-bottom:12px">
  <div id="stList"></div>
 </section>
</main>

<nav class="nav">
 <button class="on" data-a="go" data-v="ventes"><svg viewBox="0 0 24 24"><circle cx="8" cy="21" r="1"/><circle cx="19" cy="21" r="1"/><path d="M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12"/></svg>Ventes</button>
 <button data-a="go" data-v="credits"><svg viewBox="0 0 24 24"><path d="M19 7V4a1 1 0 0 0-1-1H5a2 2 0 0 0 0 4h15a1 1 0 0 1 1 1v4h-3a2 2 0 0 0 0 4h3a1 1 0 0 0 1-1v-2a1 1 0 0 0-1-1"/><path d="M3 5v14a2 2 0 0 0 2 2h15a1 1 0 0 0 1-1v-4"/></svg>Crédits<span class="bd" id="bdCr" hidden></span></button>
 <button data-a="go" data-v="stock"><svg viewBox="0 0 24 24"><path d="M11 21.73a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73z"/><path d="M12 22V12"/><path d="m3.3 7 8.7 5 8.7-5"/></svg>Stock</button>
</nav>

<div id="sheet" hidden><div class="box"><div class="bh"><b id="sTitle"></b><button data-a="close" aria-label="Fermer">×</button></div><div id="sBody"></div></div></div>
<input type="file" id="fImp" accept=".json" hidden>
<div id="toast" role="status"></div>

<script>
const $=s=>document.querySelector(s),$$=s=>[...document.querySelectorAll(s)];
const KEY='boutique_v1',STAMP_A='KYN-SHOP',STAMP_B='ABENGOUROU',pad=n=>String(n).padStart(4,'0');

/* ---------- Données (migration automatique depuis l’ancienne version) ---------- */
function norm(d){
  d=d||{};d.shop=d.shop||'KYN--SHOP';d.tel=d.tel||'';d.stock=d.stock||[];d.ventes=d.ventes||[];d.seq=d.seq||1;
  if(d.v!==2){
    let n=1;d.vers=[];
    d.ventes=d.ventes.sort((a,b)=>a.id-b.id).map(o=>{
      const v={id:o.id,date:o.date,h:o.h||'',num:pad(n++),client:o.client||'',lignes:[{lot:o.lot,nom:o.nom,pa:o.pa,pv:o.pv,q:o.q}],paye:o.paye};
      (o.remb||[]).forEach(r=>d.vers.push({id:d.seq++,date:r.date,h:'',client:v.client,m:r.m,num:pad(n++),alloc:[{vente:v.id,m:r.m}]}));
      return v});
    d.v=2;
  }
  d.vers=d.vers||[];return d;
}
let db;try{db=norm(JSON.parse(localStorage.getItem(KEY)))}catch(e){db=norm()}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){toast('Enregistrement impossible : espace insuffisant.',1)}};
const num=n=>Math.round(n).toLocaleString('fr-FR'),f=n=>num(n)+' F',fc=n=>num(n)+' F CFA',pn=n=>num(n).replace(/[\u202f\u00a0]/g,' '),pf=n=>pn(n)+' F CFA';
const iso=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const today=()=>iso(new Date()),fd=s=>s.split('-').reverse().join('/'),hm=()=>new Date().toTimeString().slice(0,5);
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cls=n=>n<0?'neg':n>0?'pos':'';
let TT;function toast(m,e){const t=$('#toast');t.textContent=m;t.className=e?'err':'';t.style.display='block';clearTimeout(TT);TT=setTimeout(()=>t.style.display='none',3200)}

const tot=v=>v.lignes.reduce((s,l)=>s+l.pv*l.q,0),ben=v=>v.lignes.reduce((s,l)=>s+(l.pv-l.pa)*l.q,0);
const paidV=v=>db.vers.reduce((s,p)=>s+p.alloc.filter(a=>a.vente===v.id).reduce((t,a)=>t+a.m,0),0);
const reste=v=>tot(v)-v.paye-paidV(v);
const arts=v=>v.lignes.map(l=>l.nom+(l.q>1?' ×'+l.q:'')).join(', ');
/* Bénéfice encaissé : le prix d’achat est récupéré en premier, seul l’excédent encaissé est du bénéfice, à la date de chaque paiement */
function evts(v){
  const E=[{d:v.date,h:v.h,m:v.paye,num:v.num,k:0,src:'v'}];
  db.vers.forEach(p=>p.alloc.forEach(a=>{if(a.vente===v.id)E.push({d:p.date,h:p.h,m:a.m,num:p.num,k:p.id,src:'p'})}));
  E.sort((a,b)=>a.k-b.k);
  const C=v.lignes.reduce((s,l)=>s+l.pa*l.q,0),T=tot(v);let cum=0;
  E.forEach(e=>{const av=cum;cum+=e.m;e.b=T<C?e.m*(T-C)/(T||1):Math.max(0,cum-C)-Math.max(0,av-C)});
  return E;
}
const benReal=v=>evts(v).reduce((s,e)=>s+e.b,0),benPend=v=>ben(v)-benReal(v);
function evIn(a,b){const R=[];db.ventes.forEach(v=>evts(v).forEach(e=>{if(e.m>0&&e.d>=a&&e.d<=b)R.push({v,e})}));return R.sort((x,y)=>y.e.d.localeCompare(x.e.d)||y.e.k-x.e.k||y.v.id-x.v.id)}
const nextNum=()=>{let m=0;[...db.ventes,...db.vers].forEach(x=>{const n=parseInt(x.num,10);if(n>m)m=n});return pad(m+1)};
const numTaken=n=>[...db.ventes,...db.vers].some(x=>x.num===n);

/* ---------- Fenêtres ---------- */
function sheet(t,h){$('#sTitle').textContent=t;$('#sBody').innerHTML=h;$('#sheet').hidden=false;document.body.style.overflow='hidden';$('#sheet .box').scrollTop=0}
function closeSheet(){$('#sheet').hidden=true;document.body.style.overflow=''}
function ask(t,m,lab,fn){ask.fn=fn;sheet(t,`<p>${m}</p><div class="foot"><button class="btn pri blk" data-a="askok">${lab}</button><button class="btn blk" data-a="close">Annuler</button></div>`)}
function go(t){$$('main section').forEach(s=>s.hidden=s.id!=='t-'+t);$$('.nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===t));scrollTo(0,0)}

/* ---------- Période ---------- */
let per={k:'jour',from:today(),to:today()};
const PERS=[['jour','Aujourd’hui'],['semaine','Semaine'],['mois','Mois'],['annee','Année'],['tout','Tout'],['perso','Dates…']];
function setPreset(k){
  if(k==='perso'){if(per.from.startsWith('0000'))per.from=per.to=today();per.k='perso';return render()}
  const n=new Date(),y=n.getFullYear(),m=n.getMonth(),d=n.getDate();let a=null,b=null;
  if(k==='jour')a=b=n;
  else if(k==='semaine'){const w=(n.getDay()+6)%7;a=new Date(y,m,d-w);b=new Date(y,m,d-w+6)}
  else if(k==='mois'){a=new Date(y,m,1);b=new Date(y,m+1,0)}
  else if(k==='annee'){a=new Date(y,0,1);b=new Date(y,11,31)}
  per={k,from:a?iso(a):'0000-01-01',to:b?iso(b):'9999-12-31'};render();
}
const perLabel=()=>per.k==='tout'?'Toutes les ventes':per.from===per.to?'Journée du '+fd(per.from):'Du '+fd(per.from)+' au '+fd(per.to);
const inPer=()=>db.ventes.filter(v=>v.date>=per.from&&v.date<=per.to).sort((a,b)=>b.date.localeCompare(a.date)||b.id-a.id);

/* ---------- Onglet Ventes ---------- */
function rVentes(){
  const j=db.ventes.filter(v=>v.date===today()),E0=evIn(today(),today()),b=E0.reduce((s,x)=>s+x.e.b,0),cash=E0.reduce((s,x)=>s+x.e.m,0),cj=j.reduce((s,v)=>s+Math.max(reste(v),0),0);
  $('#hBen').textContent=f(b);$('#hBen').className='big '+cls(b);
  $('#hSub').textContent=`${j.length} vente${j.length>1?'s':''} · encaissé ${f(cash)}`+(cj>0?` · crédits du jour ${f(cj)}`:'');
  $('#chips').innerHTML=PERS.map(p=>`<button class="chip ${p[0]===per.k?'on':''}" data-a="per" data-v="${p[0]}">${p[1]}</button>`).join('');
  $('#dts').hidden=per.k!=='perso';$('#pF').value=per.from.startsWith('0000')?'':per.from;$('#pT').value=per.to.startsWith('9999')?'':per.to;
  const r=inPer(),S=g=>r.reduce((s,v)=>s+g(v),0),kp=(a,c)=>`<div class="kpi"><small>${a}</small><b>${c}</b></div>`;
  const E=evIn(per.from,per.to),bn=E.reduce((s,x)=>s+x.e.b,0);
  $('#kpis').innerHTML=kp('Chiffre d’affaires',f(S(tot)))+kp('Encaissé',f(E.reduce((s,x)=>s+x.e.m,0)))+kp('Bénéfice encaissé',`<span class="${cls(bn)}">${f(bn)}</span>`)+kp('Crédits à recevoir',f(S(v=>Math.max(reste(v),0))));

/* ---------- Reçu ---------- */
function arcT(x,t,r,top){
  const rm=top?r+17:r-17,w=[...t].map(c=>x.measureText(c).width+5),span=w.reduce((a,b)=>a+b,0)/rm;
  let a=top?-Math.PI/2-span/2:Math.PI/2+span/2;
  [...t].forEach((c,i)=>{const da=w[i]/rm;a+=top?da/2:-da/2;x.save();x.translate(r*Math.cos(a),r*Math.sin(a));x.rotate(top?a+Math.PI/2:a-Math.PI/2);x.fillText(c,0,0);x.restore();a+=top?da/2:-da/2});
}
let _st;
function stamp(){
  if(_st!==undefined)return _st;
  try{
    const c=document.createElement('canvas');c.width=c.height=400;const x=c.getContext('2d');
    x.translate(200,200);x.rotate(-.2);x.strokeStyle=x.fillStyle='#1d3f9f';
    x.lineWidth=9;x.beginPath();x.arc(0,0,184,0,7);x.stroke();x.lineWidth=3;x.beginPath();x.arc(0,0,171,0,7);x.stroke();x.beginPath();x.arc(0,0,112,0,7);x.stroke();
    x.font='bold 46px Arial,Helvetica,sans-serif';x.textAlign='center';x.textBaseline='alphabetic';
    arcT(x,STAMP_A,122,true);arcT(x,STAMP_B,158,false);
    const star=(r,R)=>{x.beginPath();for(let i=0;i<10;i++){const a=-Math.PI/2+i*Math.PI/5,rr=i%2?r:R;x.lineTo(rr*Math.cos(a),rr*Math.sin(a))}x.closePath();x.fill()};
    star(26,62);x.save();x.translate(-142,0);star(5,12);x.restore();x.save();x.translate(142,0);star(5,12);x.restore();
    x.globalCompositeOperation='destination-out';let s=7;const rnd=()=>(s=s*16807%2147483647)/2147483647;
    for(let i=0;i<110;i++){x.globalAlpha=.55+rnd()*.4;x.beginPath();x.arc((rnd()-.5)*380,(rnd()-.5)*380,.6+rnd()*2,0,7);x.fill()}
    return _st=c.toDataURL('image/png');
  }catch(e){return _st=''}
}

  <table class="t"><thead><tr><th>Désignation</th><th class="n">Qté</th><th class="n">P.U.</th><th class="n">Montant</th></tr></thead><tbody>${d.rows.map(r=>`<tr><td>${esc(r.lib)}</td><td class="n">${r.q}</td><td class="n">${r.pu===''?'':num(r.pu)}</td><td class="n">${num(r.mt)}</td></tr>`).join('')}</tbody></table>
  <div class="pts">${d.total!=null?`<div><span>Total</span><span>${fc(d.total)}</span></div>`:''}<div class="g"><span>${d.lab}</span><span>${fc(d.verse)}</span></div><div><span>Reste dû</span><span>${fc(d.reste)}</span></div></div>
  <div class="psg"><span>Signature<br>du vendeur</span>${s?`<img src="${s}" alt="Cachet ${STAMP_A} ${STAMP_B}">`:''}</div></div></div>`;
}
function rcShow(kind,id){
  cur={kind,id};const d=rcData(kind,id);
  sheet('Reçu N° '+d.num,rcHTML(d)+`<div class="g3 noprint"><button class="btn" data-a="rpdf">PDF</button><button class="btn" data-a="share">Envoyer</button><button class="btn" data-a="print">Imprimer</button></div><div class="foot noprint" style="margin-top:8px"><button class="btn pri blk" data-a="close">Terminer</button></div>`);
}
function rcPDF(d){
  const {jsPDF}=window.jspdf,doc=new jsPDF({unit:'mm',format:'a5'}),W=148,M=12;
  doc.setFillColor(242,106,27);doc.rect(0,0,W,24,'F');doc.setTextColor(255,255,255);doc.setFont('helvetica','bold');doc.setFontSize(20);doc.text(db.shop,M,12);
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('Abengourou'+(db.tel?'  -  Tel : '+db.tel:''),M,19);
  doc.setTextColor(20,20,20);doc.setFont('helvetica','bold');doc.setFontSize(13);doc.text(d.titre,M,35);doc.text('N° '+d.num,W-M,35,{align:'right'});
  doc.setFont('helvetica','normal');doc.setFontSize(10);doc.text('Date : '+fd(d.date)+(d.h?' à '+d.h:''),M,42);if(d.client)doc.text('Client : '+d.client,M,48);
  doc.autoTable({startY:d.client?53:47,margin:{left:M,right:M},head:[['Désignation','Qté','P.U.','Montant']],body:d.rows.map(r=>[r.lib,r.q,r.pu===''?'':pn(r.pu),pn(r.mt)]),theme:'grid',styles:{fontSize:9,cellPadding:2},headStyles:{fillColor:[29,63,159]},columnStyles:{1:{halign:'right',cellWidth:12},2:{halign:'right',cellWidth:22},3:{halign:'right',cellWidth:26}}});
  let y=doc.lastAutoTable.finalY+8;doc.setFontSize(10);
  const row=(a,b,bold)=>{doc.setFont('helvetica',bold?'bold':'normal');doc.text(a,W-M-62,y);doc.text(b,W-M,y,{align:'right'});y+=6};
  if(d.total!=null)row('Total',pf(d.total));row(d.lab,pf(d.verse),true);row('Reste dû',pf(d.reste));
  y+=4;doc.setFont('helvetica','normal');doc.setTextColor(90,90,90);doc.text('Signature du vendeur',M,y+16);
  const s=stamp();if(s)try{doc.addImage(s,'PNG',W-M-46,y-2,44,44)}catch(e){}
  doc.setFontSize(8);doc.text('Merci de votre confiance.',W/2,203,{align:'center'});return doc;
}
async function rcShare(){
  if(!window.jspdf)return toast('PDF indisponible sans connexion : utilisez « Imprimer ».',1);
  const d=rcData(cur.kind,cur.id),doc=rcPDF(d),file=new File([doc.output('blob')],'recu_'+d.num+'.pdf',{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:'Reçu N° '+d.num})}catch(e){}}else{doc.save('recu_'+d.num+'.pdf');toast('PDF téléchargé : envoyez-le depuis vos fichiers.')}
}
function releve(){
  if(!window.jspdf)return toast('PDF indisponible sans connexion.',1);
  const r=[...inPer()].reverse(),E=evIn(per.from,per.to).reverse(),doc=new window.jspdf.jsPDF({orientation:'landscape'}),sm=g=>E.reduce((s,x)=>s+g(x),0);
  doc.setFontSize(16);doc.text(db.shop+' - Abengourou',14,16);doc.setFontSize(10);doc.text('Relevé - '+perLabel()+'   (montants en F CFA)',14,23);
  doc.autoTable({startY:28,styles:{fontSize:9},headStyles:{fillColor:[242,106,27]},footStyles:{fillColor:[238,240,243],textColor:20},columnStyles:{4:{halign:'right'},5:{halign:'right'}},
    head:[['N°','Date','Client','Articles','Total vente','Crédit restant']],
    body:r.map(v=>[v.num,fd(v.date),v.client||'',arts(v),pn(tot(v)),reste(v)>0.5?pn(reste(v)):'-']),
    foot:[['','Total','','',pn(r.reduce((s,v)=>s+tot(v),0)),pn(r.reduce((s,v)=>s+Math.max(reste(v),0),0))]]});
  const y=doc.lastAutoTable.finalY+10;doc.setFontSize(12);doc.text('Encaissements et bénéfice de la période',14,y);
  doc.autoTable({startY:y+3,styles:{fontSize:9},headStyles:{fillColor:[29,63,159]},footStyles:{fillColor:[238,240,243],textColor:20},columnStyles:{5:{halign:'right'},6:{halign:'right'}},
    head:[['Date','Reçu N°','Client','Articles','Type','Encaissé','Bénéfice']],
    body:E.map(({v,e})=>[fd(e.d),e.num,v.client||'',arts(v),e.src==='v'?'À l’achat':'Versement',pn(e.m),pn(e.b)]),
    foot:[['Total','','','','',pn(sm(x=>x.e.m)),pn(sm(x=>x.e.b))]]});
  doc.save('releve_'+(per.k==='tout'?'complet':per.from+'_'+per.to)+'.pdf');
}

/* ---------- Réglages et sauvegarde ---------- */
const VER='2.1';
function openSet(){
  const sa=matchMedia('(display-mode: standalone)').matches||navigator.standalone,ios=/iphone|ipad|ipod/i.test(navigator.userAgent);
  const inst=sa?'<p class="note">Vous utilisez déjà l’application installée.</p>':window.__dip?'<button class="btn pri blk" data-a="inst">Installer sur ce téléphone</button>':ios?'<p class="note">Sur iPhone : ouvrez cette page dans Safari, touchez Partager, puis « Sur l’écran d’accueil ».</p>':'<p class="note">Dans Chrome : menu ⋮ puis « Installer l’application ». Si cette option n’apparaît pas, l’application est peut-être déjà installée : cherchez l’icône KYN--SHOP sur votre téléphone.</p>';
  sheet('Réglages',`<label>Nom de la boutique</label><input id="rN" class="in" value="${esc(db.shop)}"><label>Téléphone (affiché sur les reçus)</label><input id="rT" class="in" type="tel" value="${esc(db.tel)}">
  <div class="foot"><button class="btn pri blk" data-a="saveSet">Enregistrer</button></div>
  <h4>Installation</h4>${inst}
  <h4>Sauvegarde</h4><p class="note">Vos données sont enregistrées sur cet appareil. Exportez une sauvegarde chaque semaine et conservez le fichier (WhatsApp, Drive, e-mail).</p>
  <div class="g3" style="grid-template-columns:1fr 1fr;margin-bottom:8px"><button class="btn" data-a="exp">Exporter</button><button class="btn" data-a="imp">Importer</button></div>
  <p class="note" style="text-align:center">Version ${VER}</p>`);
}
$('#fImp').onchange=e=>{
  const fl=e.target.files[0];if(!fl)return;const r=new FileReader();
  r.onload=()=>{try{const x=JSON.parse(r.result);if(!Array.isArray(x.stock)||!Array.isArray(x.ventes))throw 0;ask('Importer une sauvegarde','Remplacer toutes les données actuelles par cette sauvegarde ?','Remplacer',()=>{db=norm(x);save();render();toast('Sauvegarde importée.')})}catch(_){toast('Fichier de sauvegarde invalide.',1)}};
  r.readAsText(fl);e.target.value='';
};

/* ---------- Actions ---------- */
const A={
  go:b=>go(b.dataset.v),per:b=>setPreset(b.dataset.v),new:openVente,close:closeSheet,
  askok:()=>{const fn=ask.fn;closeSheet();fn&&fn()},
  vente:b=>vDetail(+b.dataset.id),client:b=>openClient(b.dataset.k),enc:b=>openEnc(b.dataset.k),solde:b=>{$('#eM').value=b.dataset.v},doenc:b=>doEnc(b.dataset.k),
  add:b=>{const id=+b.dataset.id,l=db.stock.find(x=>x.id===id),c=cart.find(x=>x.lot===id);if(c){if(c.q<l.qte)c.q++;else toast('Il ne reste que '+l.qte+' en stock.',1)}else cart.push({lot:id,nom:l.nom,pa:l.pa,pv:l.pv,q:1});$('#cQ').value='';cRes();cLines()},
  q:b=>{const l=cart[+b.dataset.i],lot=db.stock.find(x=>x.id===l.lot),n=l.q+ +b.dataset.d;if(n<1)return;if(n>lot.qte)return toast('Il ne reste que '+lot.qte+' en stock.',1);l.q=n;cLines()},
  rm:b=>{cart.splice(+b.dataset.i,1);cLines()},
  pay:b=>{payMode=b.dataset.v;$$('.seg [data-a=pay]').forEach(x=>x.classList.toggle('on',x.dataset.v===payMode));$('#cCred').hidden=payMode!=='credit';$('#cLab').textContent=payMode==='credit'?'Nom du client (obligatoire)':'Nom du client (facultatif)';cTot()},
  ok:valider,
  xv:b=>ask('Annuler la vente','Les articles seront remis en stock et les versements liés supprimés.','Annuler la vente',()=>annulerVente(+b.dataset.id)),
  xp:b=>ask('Annuler le versement','Le montant sera de nouveau dû par le client.','Annuler le versement',()=>{db.vers=db.vers.filter(p=>p.id!==+b.dataset.id);save();render();toast('Versement annulé.')}),
  rcv:b=>rcShow(b.dataset.kind,+b.dataset.id),rpdf:()=>window.jspdf?(d=>rcPDF(d).save('recu_'+d.num+'.pdf'))(rcData(cur.kind,cur.id)):toast('PDF indisponible sans connexion : utilisez « Imprimer ».',1),
  share:rcShare,print:()=>window.print(),releve,
  art:b=>openArt(+b.dataset.id),saveArt:b=>saveArt(+b.dataset.id),
  delArt:b=>ask('Supprimer l’article','L’historique des ventes est conservé.','Supprimer',()=>{db.stock=db.stock.filter(x=>x.id!==+b.dataset.id);save();render()}),
  stv:b=>{stv=b.dataset.v;rStock()},settings:openSet,
  ben:()=>openBen(today(),today(),'Bénéfice du jour'),benper:()=>openBen(per.from,per.to,'Bénéfice · '+perLabel()),
  inst:()=>{const d=window.__dip;if(!d||!d.prompt)return;d.prompt();d.userChoice.then(()=>{window.__dip=null;$('#bInst').hidden=true;closeSheet()})},
  saveSet:()=>{db.shop=$('#rN').value.trim()||'KYN--SHOP';db.tel=$('#rT').value.trim();save();closeSheet();render();toast('Réglages enregistrés.')},
  exp:()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:'application/json'}));a.download='sauvegarde_kyn-shop_'+today()+'.json';a.click()},
  imp:()=>$('#fImp').click()
};
document.addEventListener('click',e=>{
  if(e.target.id==='sheet')return closeSheet();
  const b=e.target.closest('[data-a]');if(b&&A[b.dataset.a])A[b.dataset.a](b);
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='cQ')cRes();
  else if(t.dataset.pv!==undefined){const l=cart[+t.dataset.pv];l.pv=Math.max(+t.value||0,0);t.closest('.ln').querySelector('.a span:last-child').textContent=f(l.pv*l.q);cTot()}
  else if(t.id==='cAc')cTot();else if(t.id==='stQ')rStock();else if(t.id==='crQ')rCredits();
});
document.addEventListener('change',e=>{
  if(e.target.id==='pF'){per.from=e.target.value||'0000-01-01';render()}
  if(e.target.id==='pT'){per.to=e.target.value||'9999-12-31';render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!$('#sheet').hidden)closeSheet()});

function render(){
  $('#shop').textContent=db.shop;document.title=db.shop;
  $('#today').textContent=new Date().toLocaleDateString('fr-FR',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  rVentes();rCredits();rStock();
}
render();
if(window.__dip)$('#bInst').hidden=false;
</script>
</body>
</html>
